# A required check. It passes at once unless the PR completes a feature file (docs/features/)
# or has the needs-approval label; then it waits for an approval from someone other than the
# author. It runs again on each review, so an approval turns it green. See docs/Quality-Gates.md.
name: Feature sign-off

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: feature-signoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: Feature sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - run: node .github/scripts/feature-signoff.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
