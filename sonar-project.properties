# SonarQube Cloud (CI-based analysis from .github/workflows/ci.yml).
# Keys must match the SonarQube Cloud project: Administration -> Project information.
sonar.organization=akv-iu
sonar.projectKey=akv-iu_Convo
sonar.projectName=Convo

sonar.sources=src,db,es,scripts
sonar.tests=src,tests
sonar.exclusions=**/*.test.ts,db/migrations/**
sonar.test.inclusions=**/*.test.ts,tests/**

# Vitest writes this with `npm test -- --coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Screens are covered by Playwright, not unit coverage; seed data, scripts and
# schema have no logic worth a unit test.
sonar.coverage.exclusions=src/app/**/*.tsx,src/components/**,src/contracts/fixtures/**,src/instrumentation.ts,db/**,es/**,scripts/**,tests/**
sonar.cpd.exclusions=src/contracts/fixtures/**
